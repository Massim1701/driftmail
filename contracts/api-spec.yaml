openapi: 3.0.3
info:
  title: driftmail API
  version: 0.1.0
  description: >
    Track 0 Contract. Track A implementiert diese Spec real.
    Track C und F bauen zunächst gegen einen Mock-Server, der exakt
    diese Response-Formate zurückgibt.

servers:
  - url: https://api.driftware.online/v1

security:
  - bearerAuth: []

paths:
  /auth/session:
    post:
      summary: >
        Session-Token erneuern. Login selbst passiert implizit durch den
        OAuth-Flow beim Verbinden eines Mail-Kontos (siehe POST /accounts),
        dieser Endpoint dient nur der Token-Erneuerung. `security: []`
        bedeutet nur, dass ein bereits abgelaufener Token hier ausnahmsweise
        nicht per globalem `bearerAuth`-Mechanismus mit 401 abgewiesen wird,
        bevor der Handler ihn sieht -- der (noch nicht abgelaufene, bzw.
        innerhalb der serverseitigen Kulanzfrist liegende) aktuelle Token
        muss trotzdem im `Authorization`-Header mitgeschickt werden, sonst
        401. [2026-09-10] Terminal, siehe backend/README.md "Auth": bisher
        war dieser Endpoint zwar spezifiziert, aber von keinem Code
        implementiert (wie zuvor schon bei /messages/{messageId}/unsubscribe).
      security: []
      responses:
        "200":
          description: Neues Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401":
          description: Kein/ungueltiger/abgelaufener Token im Authorization-Header

  /auth/google/start:
    get:
      summary: >
        Echter Google-Login starten (Browser-Redirect, kein JSON-Endpoint).
        [2026-09-10] WEB_INBOX.md "Antwort auf die zwei Fragen zu Auth":
        Server-seitiger OAuth-Redirect-Flow -- der Client ruft diese URL per
        Navigation (nicht `fetch`) auf, der Server leitet direkt zu Googles
        Consent-Screen weiter. `503`, falls Google-OAuth nicht konfiguriert
        ist (siehe backend/README.md "Auth"), dann bleibt `POST /accounts`
        als Fallback.
      security: []
      responses:
        "302":
          description: Redirect zu Googles OAuth-Consent-Screen
        "503":
          description: Google-OAuth ist serverseitig nicht konfiguriert

  /auth/google/callback:
    get:
      summary: >
        Redirect-Ziel nach Googles Consent-Screen (`code`-Query-Parameter).
        Tauscht den Code serverseitig gegen Tokens, liest die verifizierte
        E-Mail-Adresse von Google (nie vom Client), prüft sie gegen die
        Allowlist (`ALLOWED_EMAILS`, backend/README.md "Auth"), legt bei
        Erstanmeldung User + Standard-Ordner an und leitet danach IMMER zu
        `FRONTEND_URL/auth/callback` weiter -- entweder mit `?token=...`
        (Erfolg) oder `?error=<code>` (siehe backend/README.md für die
        möglichen Fehlercodes, z.B. `not_allowlisted`).
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect zu FRONTEND_URL/auth/callback mit token oder error

  /mail-providers:
    get:
      summary: >
        Liste unterstuetzter Mail-Provider fuer die Onboarding-Provider-
        Auswahl (WEB_INBOX.md 15.09., "ECHTE LUECKE ENTDECKT"). Laeuft vor
        dem Login, `security: []`. Statische Konfiguration aus
        contracts/mail-providers.json, EINE Quelle fuer alle Plattformen
        statt pro-Plattform hartcodierter Presets (gleiches Prinzip wie
        design-tokens.json).
      security: []
      responses:
        "200":
          description: Liste der Provider-Presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MailProvider"

  /link-check:
    get:
      summary: >
        [2026-09-21] "ZWEI ENTERPRISE-SICHERHEITS-FEATURES - echtes
        Alleinstellungsmerkmal" Punkt 2, "Klick-Zeit-Link-Pruefung": prueft
        eine Ziel-URL erneut im Moment des Klicks (Homoglyph-Erkennung +
        Domain-Reputation), nicht nur einmalig beim Empfang der Mail --
        schuetzt vor "time-of-click"-Angriffen (eine zunaechst harmlose
        Zielseite wird nach der Zustellung gegen eine boesartige
        getauscht). `security: []` -- wird durch eine echte Browser-
        Navigation aufgerufen (Klick auf einen Link in einer Mail), kein
        Bearer-Token vorhanden. Leitet bei einer als sicher eingestuften
        URL per 302 direkt weiter; bei einer verdaechtigen URL liefert der
        Endpunkt stattdessen eine Warn-Seite (200, text/html) mit der
        Moeglichkeit, trotzdem fortzufahren -- siehe backend/README.md
        "Klick-Zeit-Link-Pruefung" fuer die Aufwands-Einschaetzung
        (Backend-Teil vollstaendig, Client-seitiges Auto-Linkify der
        Klartext-Mail-Koerper ist ein separater, noch offener Schritt).
      security: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: URL als sicher eingestuft, Weiterleitung zur Zielseite
        "200":
          description: URL als verdächtig eingestuft, Warn-Seite (text/html)
        "400":
          description: Fehlender oder ungültiger url-Parameter

  /accounts:
    get:
      summary: Verbundene Mail-Konten des angemeldeten Users auflisten
      responses:
        "200":
          description: Liste der Mail-Konten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MailAccount"
    post:
      summary: >
        Mail-Konto verbinden -- das ist zugleich der Login/Registrierungs-
        Weg (siehe /auth/session-Beschreibung). [2026-09-10] Terminal,
        Contract-Luecke geschlossen: dieser Endpoint fehlte komplett, obwohl
        /auth/session bereits seit Track 0 darauf verwies. Legt bei erster
        Verbindung dieser E-Mail-Adresse einen neuen User + dessen 7
        Standard-Ordner an, sonst wird der bestehende User/das bestehende
        Konto wiederverwendet.
        [2026-09-21] Mehrfach-Konten (WEB_INBOX.md 21.09. Punkt 2): wird
        dieser Endpoint MIT einem gueltigen `Authorization: Bearer`-Header
        aufgerufen (optional -- der Endpoint bleibt technisch
        `security: []`, ein fehlender/ungueltiger Token wird wie "nicht
        eingeloggt" behandelt, kein 401), wird das Konto an den ANGEMELDETEN
        User angehaengt (echtes weiteres Konto), statt wie bisher immer
        User-Zuordnung ueber die E-Mail-Adresse selbst vorzunehmen. Pro
        (User, E-Mail-Adresse) hoechstens ein Konto (idempotent, wie schon
        bisher pro User). Ohne Token unveraendert der bisherige Login-/
        Registrierungs-Weg (erstes Konto). Gilt aktuell nur fuer
        `provider=imap` -- `provider=gmail` ueber diesen Fallback-Endpunkt
        theoretisch auch, aber der empfohlene ECHTE Gmail-Weg
        (`GET /auth/google/start`) unterstuetzt das Anhaengen an einen
        bestehenden User noch nicht (der Redirect-Callback kennt keinen
        bestehenden Login-Zustand), siehe SYNC.md "Offene Frage". [2026-09-10]
        Fuer Gmail mit konfiguriertem Google-OAuth (siehe backend/README.md
        "Auth") ist `GET /auth/google/start` der echte, empfohlene Weg --
        dieser Endpoint bleibt als Fallback (kein Google-OAuth konfiguriert)
        und `oauthCode` bleibt unausgewertet (Gmail laeuft ausschliesslich
        ueber den Redirect-Flow, nie ueber einen im Body mitgeschickten
        Code). Unterliegt derselben Allowlist-Pruefung (`ALLOWED_EMAILS`)
        wie der echte Google-Login, `403` bei nicht freigeschalteter
        Adresse.
        [2026-09-19] Fuer `provider=imap` (WEB_INBOX.md 15.09., "ECHTE
        LUECKE ENTDECKT": GMX/web.de/iCloud/generisches IMAP) sind
        `imapHost`+`imapPassword` jetzt echt: die Zugangsdaten werden vor
        dem Speichern per echtem IMAP-Login getestet (`422` bei
        Fehlschlag), danach verschluesselt abgelegt
        (`mail_accounts.encrypted_imap_credentials`) und vom Mail-Sync
        dieses Kontos tatsaechlich verwendet -- keine Platzhalter-Pruefung
        mehr. `imapUser` faellt auf `emailAddress` zurueck, wenn nicht
        angegeben (haeufigster Fall: Login-Adresse = IMAP-User). SMTP-Felder
        optional, fallen auf `imapHost`+Port 587 (STARTTLS) zurueck, falls
        nicht angegeben (gleiches Verhalten wie beim bestehenden Env-Var-
        Fallback-Pfad, siehe backend/README.md). Gilt nur beim ERSTMALIGEN
        Verbinden -- ein zweiter Aufruf mit derselben E-Mail-Adresse
        aendert die bereits gespeicherten Zugangsdaten NICHT (kein Update-
        Pfad in diesem Schritt, siehe backend/README.md "Provider-Support").
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [provider, emailAddress]
              properties:
                provider: { type: string, enum: [gmail, imap] }
                emailAddress: { type: string }
                oauthCode: { type: string, description: "Gmail: nicht ausgewertet, siehe summary -- echter Login laeuft ueber GET /auth/google/start" }
                imapHost: { type: string, description: "IMAP: erforderlich fuer provider=imap, z.B. imap.gmx.net (siehe GET /mail-providers)" }
                imapPort: { type: integer, description: "IMAP: Default 993" }
                imapSecure: { type: boolean, description: "IMAP: Default true (implizites TLS)" }
                imapUser: { type: string, description: "IMAP: Default = emailAddress, falls abweichend (selten)" }
                imapPassword: { type: string, description: "IMAP: erforderlich fuer provider=imap, App-spezifisches Passwort" }
                smtpHost: { type: string, description: "IMAP: optional, Default = imapHost" }
                smtpPort: { type: integer, description: "IMAP: optional, Default 587" }
                smtpSecure: { type: boolean, description: "IMAP: optional, Default false (STARTTLS statt implizitem TLS)" }
      responses:
        "200":
          description: Konto verbunden, neuer Session-Token ausgestellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: "#/components/schemas/MailAccount"
                  token: { type: string }
        "400":
          description: provider/emailAddress fehlt/ungueltig, oder bei provider=imap fehlt imapHost/imapPassword
        "403":
          description: emailAddress ist nicht auf der Allowlist (ALLOWED_EMAILS)
        "422":
          description: provider=imap -- die angegebenen IMAP-Zugangsdaten konnten nicht verifiziert werden (echter Verbindungsversuch fehlgeschlagen)

  /accounts/{accountId}/sync:
    post:
      summary: >
        Manueller Mail-Abruf fuer EIN Konto (WEB_INBOX.md 21.09. "SEHR
        WICHTIGE LUECKE - HOECHSTE PRIORITAET", Punkt 1). Stoesst denselben
        Sync-Vorgang an, der sonst periodisch im Hintergrund laeuft (Default
        alle 3 Minuten, `MAIL_SYNC_INTERVAL_MINUTES`), sofort statt beim
        naechsten Intervall -- fuer einen "Jetzt aktualisieren"-Button bzw.
        Pull-to-Refresh in der Client-UI. Nur fuer das eigene Konto
        (Ownership-Check gegen den Bearer-Token).
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sync abgeschlossen
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  autoDeleted: { type: integer }
                  syncStatus: { type: string, enum: [pending, syncing, ok, error] }
        "404":
          description: Konto nicht gefunden oder gehoert nicht dem angemeldeten User
        "502":
          description: Sync fehlgeschlagen (z.B. Mail-Server nicht erreichbar)
    delete:
      summary: >
        [2026-09-21] WEB_INBOX.md "NEUER AUFTRAG - Einstellungsbereich +
        Info-Seite", Punkt 1 "Konten-Verwaltung": verbundenes Konto
        entfernen. Loescht auch alle daran haengenden Ordner/Nachrichten/
        Entwuerfe (Cascade). 400, wenn es das letzte Konto des Users waere
        (Auth laeuft implizit ueber Mail-Konto-Verbindung, siehe
        backend/README.md "Auth" -- ohne jedes Konto gaebe es keinen Weg
        mehr, sich erneut anzumelden).
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Entfernt
        "400":
          description: Letztes verbleibendes Konto kann nicht entfernt werden
        "404":
          description: Konto nicht gefunden oder gehoert nicht dem angemeldeten User

  /folders:
    get:
      summary: >
        Ordner des Users auflisten (System- und eigene Ordner). [2026-09-21]
        Mehrfach-Konten (WEB_INBOX.md 21.09. Punkt 2): mit `accountId` nur
        die Ordner DIESES Kontos (Ownership-Check), ohne `accountId` die
        Ordner ALLER verbundenen Konten des Users zusammen (flache Liste,
        jeder Folder traegt seine `accountId` -- Client gruppiert selbst,
        siehe "getrennte Ansichten pro Konto").
      parameters:
        - name: accountId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Liste der Ordner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
    post:
      summary: >
        Neuen eigenen Ordner anlegen. `accountId` ist erforderlich, sobald
        der User mehr als ein Konto verbunden hat (sonst 400 -- nicht
        erratbar, zu welchem Konto der Ordner gehoeren soll); bei genau
        einem Konto faellt es auf dieses zurueck.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                icon: { type: string }
                accountId: { type: string, format: uuid }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          description: accountId fehlt und ist bei mehreren verbundenen Konten nicht eindeutig ableitbar

  /folders/{folderId}:
    patch:
      summary: Ordner umbenennen/Icon ändern (System-Ordner außer quarantaene/spam ebenfalls umbenennbar)
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                icon: { type: string }
                sortOrder: { type: integer }
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
    delete:
      summary: Eigenen Ordner löschen (System-Ordner nicht löschbar)
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Gelöscht

  /trusted-senders:
    get:
      summary: Vertrauenswuerdige Absender des Users auflisten
      responses:
        "200":
          description: Liste der vertrauenswuerdigen Absender
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustedSender"
    post:
      summary: >
        Absender als vertrauenswuerdig markieren (User-Entscheidung, keine
        automatische Klassifikation). Wirkt ab sofort fuer kuenftige Mail
        dieser Adresse -- landet dann unabhaengig vom sonstigen
        Auth-/Link-/Inhalts-Signal direkt in eingang. Idempotent: erneutes
        Hinzufuegen derselben Adresse liefert den bestehenden Eintrag.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [senderAddress]
              properties:
                senderAddress: { type: string }
      responses:
        "201":
          description: Hinzugefuegt (oder bereits vorhanden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustedSender"

  /trusted-senders/{trustedSenderId}:
    delete:
      summary: Vertrauenswuerdigen Absender wieder entfernen
      parameters:
        - name: trustedSenderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Entfernt

  /contacts:
    get:
      summary: >
        [2026-09-21] WEB_INBOX.md "FUENF NEUE KOMFORT-FEATURES", Punkt 2
        "Kontakt-Autovervollstaendigung beim Verfassen": bekannte
        Adressen fuer An/CC/BCC-Vorschlaege im Compose-Screen. Einfache
        Ableitung aus bisherigen Absenderadressen (empfangene Mail, ueber
        alle eigenen Konten) und bereits gesendeten Adressen
        (outgoing_send_log) -- kein eigenes Kontakte-Feature/eigene
        Tabelle.
      responses:
        "200":
          description: Bekannte Adressen, dedupliziert, alphabetisch sortiert
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /messages:
    get:
      summary: >
        Nachrichten eines Ordners abrufen, optional gefiltert per `q`
        (WEB_INBOX.md 21.09. "2) Suche ueber Mails"): einfache, case-
        insensitive Substring-Suche ueber Betreff/Absenderadresse/
        Absender-Anzeigename/Nachrichtentext. Kombinierbar mit folderId
        (nur in diesem Ordner suchen) -- ueblicher Client-Weg ist `q` +
        `accountId` OHNE `folderId`, um ueber alle Ordner des Kontos zu
        suchen. [2026-09-21] "5 Wettbewerbs-Luecken" Punkt 5 ("Snooze"):
        Nachrichten mit `snoozedUntil` in der Zukunft werden hier
        NICHT geliefert (siehe POST /messages/{messageId}/snooze), tauchen
        aber ueber GET /messages/{messageId} direkt weiterhin auf.
      parameters:
        - name: folderId
          in: query
          schema:
            type: string
            format: uuid
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Liste der Nachrichten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /messages/{messageId}:
    get:
      summary: Einzelne Nachricht inkl. Security-Analyse und Links
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nachricht mit Analyse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetail"
    delete:
      summary: Mail in den Papierkorb verschieben (soft delete)
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: In Papierkorb verschoben

  /messages/{messageId}/permanent:
    delete:
      summary: Mail endgueltig loeschen (nur aus dem Papierkorb heraus moeglich)
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Endgueltig geloescht

  /messages/{messageId}/quarantine:
    post:
      summary: Nachricht manuell in Quarantäne verschieben
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Quarantäne-Eintrag erstellt

  /messages/{messageId}/snooze:
    post:
      summary: >
        [2026-09-21] "NEUE AUFTRAEGE - 5 Wettbewerbs-Luecken" Punkt 5
        ("Snooze"): Nachricht voruebergehend aus der Ordner-Ansicht
        ausblenden, taucht automatisch wieder auf, sobald `until` erreicht
        ist. `until: null` hebt ein bestehendes Snooze sofort wieder auf
        ("Jetzt wieder anzeigen").
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: Aktualisierte Nachricht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: "until liegt nicht in der Zukunft"

  /messages/{messageId}/move:
    post:
      summary: Nachricht in einen anderen Ordner verschieben
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [folderId]
              properties:
                folderId: { type: string, format: uuid }
      responses:
        "200":
          description: Verschoben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/{messageId}/unsubscribe:
    post:
      summary: >
        Abmeldung ueber RFC-8058 List-Unsubscribe-Header anstoßen. 400, wenn
        die Nachricht keinen gueltigen List-Unsubscribe-Header hat. Siehe
        auch WEB_INBOX.md 09.09. "Automatisches Abmelden bei Spam": fuer
        Nachrichten mit classification='spam' (NIE 'phishing') loest das
        Backend denselben Mechanismus zusaetzlich automatisch aus, ohne
        Rueckfrage -- dieser Endpunkt bleibt der Weg fuer eine vom User
        selbst angestoßene Abmeldung bei allen anderen Nachrichten mit einem
        List-Unsubscribe-Header.
        [2026-09-21] "LUECKE SCHLIESSEN - echter Abmelde-Aufruf" (WEB_INBOX.md
        21.09.): loest jetzt einen ECHTEN Netzwerk-Aufruf aus (mailto: ueber
        den Provider-Sende-Mechanismus, https: per HTTP-GET/POST je nachdem
        ob List-Unsubscribe-Post vorhanden ist) und liefert synchron das
        tatsaechliche Ergebnis zurueck -- status='pending_confirmation' aus
        der Ursprungsversion gibt es nicht mehr (war ein dauerhafter
        Endzustand ohne je folgenden Schritt).
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Abmeldung angestoßen
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [confirmed, failed]
                    description: >
                      [2026-09-21] KORREKTUR: pending_confirmation/rejected
                      entfallen -- der Aufruf ist jetzt synchron, das
                      Ergebnis steht sofort fest.
        "400":
          description: Nachricht hat keinen gueltigen List-Unsubscribe-Header
        "404":
          description: Nachricht nicht gefunden

  /messages/{messageId}/summary:
    get:
      summary: KI-Zusammenfassung ("Was wollen die von mir")
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Zusammenfassung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSummary"

  /messages/{messageId}/reply-draft:
    post:
      summary: Antwortentwurf generieren lassen
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entwurf
          content:
            application/json:
              schema:
                type: object
                properties:
                  draftText:
                    type: string
                  source:
                    type: string
                    enum: [on_device, cloud_fallback, heuristic]
                    description: >
                      [2026-09-21] KORREKTUR (TERMINAL_INBOX.md 21.09.):
                      neues Feld -- vorher fehlte source hier komplett,
                      obwohl draftReply() laut ai-adapter-interface.ts schon
                      laenger ein AiAdapterResult<string> liefert (siehe
                      SYNC.md 08.09.). Ohne dieses Feld konnte die UI nie
                      ehrlich anzeigen, woher ein KI-Entwurf kam.

  /messages/draft/phishing-check:
    post:
      summary: >
        Prueft einen Mail-Entwurf vor dem Versand auf Phishing-Merkmale
        (harter Block, siehe blocked) sowie nicht-blockierende Warnsignale
        (sensible Daten, Empfaenger-Reputation, riskante Links). Nutzt
        dieselben Signale wie SecurityResult/analyzeMail, angewendet auf den
        eigenen Entwurf statt auf eingehende Mails (siehe WEB_INBOX.md 08.09.).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bodyText: { type: string }
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      displayText: { type: string }
                      actualUrl: { type: string }
                recipientAddress:
                  type: string
                  nullable: true
                  description: >
                    Optional. Ziel-Adresse des Entwurfs, Grundlage für
                    recipientReputation (siehe unten). Ohne dieses Feld bleibt
                    recipientReputation "unknown" (SYNC.md 08.09., kleinere
                    Contract-Ergänzung).
      responses:
        "200":
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: boolean
                    description: >
                      true = Phishing-Merkmale erkannt, Versand MUSS verhindert
                      werden (kein Warnen-und-trotzdem-erlauben).
                  reason: { type: string, nullable: true }
                  containsSensitiveData:
                    type: array
                    items: { type: string, enum: [iban, credit_card, other] }
                  recipientReputation:
                    type: string
                    enum: [safe, unknown, flagged]
                  riskyLinks:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        reason: { type: string }

  /messages/send:
    post:
      summary: >
        Sendet eine Mail (neu oder Antwort). Loest VOR dem eigentlichen Versand
        den Phishing-Check aus (dieselbe Logik wie POST
        /messages/draft/phishing-check, serverseitig auf bodyText angewendet),
        blocked=true verhindert das Senden (422). Lehnt ausserdem ab (422),
        wenn irgendeine mitgegebene attachmentId nicht scan_status='clean'
        hat (siehe POST /attachments) -- kein Versand mit ungeprueften oder
        als gefaehrlich erkannten Anhaengen. Schreibt nach erfolgreichem
        Versand einen outgoing_send_log-Eintrag pro Empfaenger (to + cc) fuer
        die Abuse-Erkennung, legt eine lokale messages-Zeile im
        "gesendet"-Systemordner an (fuer sofortige UI-Sichtbarkeit) und
        loescht (falls draftId gesetzt) den zugehoerigen Entwurf. Siehe
        WEB_INBOX.md 09.09. "Fehlender Senden-Endpunkt" + "Erweiterung des
        Send-Endpunkt-Eintrags von eben" (Anhaenge) + "KORREKTUR/ERWEITERUNG
        des Ordner-Umbau-Eintrags" (gesendet-Ordner, draftId).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [to, bodyText]
              properties:
                accountId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Erforderlich, ausser inReplyToMessageId ist gesetzt (dann
                    wird das Konto der Ursprungsnachricht verwendet).
                inReplyToMessageId: { type: string, format: uuid, nullable: true }
                to:
                  type: array
                  items: { type: string }
                cc:
                  type: array
                  items: { type: string }
                bcc:
                  type: array
                  items: { type: string }
                  description: >
                    [2026-09-21] WEB_INBOX.md 21.09. "3) CC/BCC beim
                    Verfassen". Landet nie in einem sichtbaren Header/im
                    lokalen "gesendet"-Ordner-Eintrag, nur im tatsaechlichen
                    Provider-Versand (SMTP-Envelope bzw. Gmail-Bcc-Header,
                    von beiden Providern vor Auslieferung an to/cc entfernt).
                subject: { type: string }
                bodyText: { type: string }
                attachmentIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: >
                    IDs aus POST /attachments. Jede muss scan_status='clean'
                    haben, sonst 422 (keine Ausnahme).
                draftId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Optional. Falls diese Mail aus einem Entwurf (POST/PATCH
                    /drafts) stammt, wird dieser Entwurf nach erfolgreichem
                    Versand automatisch geloescht (intern, kein separater
                    DELETE /drafts/{draftId}-Aufruf noetig).
                confidentialUntil:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    [2026-09-21] WEB_INBOX.md "DREI WEITERE FEATURES - Gmail-
                    Recherche" Punkt 3 ("Vertraulicher Modus"). Muss, falls
                    gesetzt, ein gueltiger, in der Zukunft liegender
                    Zeitpunkt sein (sonst 400) -- siehe Message.confidentialUntil.
                timeSinceDraftShownMs:
                  type: integer
                  nullable: true
                  description: >
                    [2026-09-25] WEB_INBOX.md 08.09. "Bot/Human-
                    Missbrauchserkennung beim Versand": optional, nur bei
                    Antworten (inReplyToMessageId gesetzt) sinnvoll --
                    Millisekunden zwischen "Antworten"-Tap/Klick (Entwurf
                    sichtbar) und diesem Sende-Aufruf. Implausibel kurze
                    Werte (siehe backend/README.md fuer den Schwellenwert)
                    deuten auf einen automatisierten/kompromittierten
                    Absender statt eines Menschen hin, der die Original-
                    mail tatsaechlich gelesen hat -- rein informativ
                    (flag_reason='no_read_before_reply'), blockiert den
                    Versand NIE. Ohne dieses Feld (Client sendet es nicht)
                    wird dieser eine Check einfach uebersprungen.
      responses:
        "200":
          description: Gesendet
          content:
            application/json:
              schema:
                type: object
                properties:
                  sentMessageId: { type: string }
        "422":
          description: >
            Blockiert -- entweder der Phishing-Check (blocked=true) oder ein
            mitgegebener Anhang ohne scan_status='clean' (gleiche Response-Form).
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked: { type: boolean }
                  reason: { type: string }
        "429":
          description: >
            [2026-09-25] WEB_INBOX.md 08.09. "Bot/Human-Missbrauchserkennung
            beim Versand": wiederholtes Ueberschreiten desselben
            Missbrauchs-Schwellenwerts (rate_burst/many_new_recipients/
            duplicate_content) innerhalb eines kurzen Zeitfensters, nachdem
            bereits einmal nur gewarnt (send_abuse_flags.action_taken=
            'warned') wurde -- Versand wird dieses Mal abgelehnt
            (action_taken='rate_limited'). Erstmaliges Ueberschreiten wird
            NICHT blockiert, nur vermerkt (kein Response-Unterschied zu 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        "400":
          description: Ungueltige Eingabe (z.B. weder accountId noch inReplyToMessageId, kein Empfaenger)
        "502":
          description: Versand beim Mail-Provider fehlgeschlagen

  /attachments:
    post:
      summary: >
        Datei hochladen und sofort scannen (vor dem eigentlichen Senden).
        Muss scan_status='clean' liefern, bevor die attachmentId bei
        POST /messages/send verwendet werden darf. Siehe WEB_INBOX.md 09.09.
        "Erweiterung des Send-Endpunkt-Eintrags von eben". [2026-09-21]
        "WICHTIGE LUECKE ENTDECKT - echter Malware-Scan": echter ClamAV-Scan
        (Dateiendungs-Blockliste + Magic-Bytes-Pruefung + Signaturabgleich),
        siehe backend/README.md "Malware-Scan". Derselbe Scan laeuft jetzt
        auch fuer EINGEHENDE Mail-Anhaenge (siehe MessageDetail.attachments
        unten) -- nicht nur beim Senden.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Hochgeladen, Scan-Ergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachmentId: { type: string, format: uuid }
                  scanStatus:
                    type: string
                    enum: [pending, clean, malicious, blocked_type, scan_failed]
                  containsSensitiveDocument:
                    type: string
                    enum: [none, credit_card, id_document]
                    description: >
                      [2026-09-15] WEB_INBOX.md "Sensible-Daten-Erkennung um
                      Fotos von Ausweisen/Kreditkarten erweitern": nur fuer
                      Bild-Anhaenge per OCR + Text-Pattern-Erkennung ermittelt
                      (sonst 'none', kein OCR-Lauf noetig/versucht). NICHT
                      blockierend, reiner Warnhinweis -- analog zu
                      containsSensitiveData beim Draft-Phishing-Check.
        "400":
          description: Keine Datei mitgeschickt

  /drafts:
    get:
      summary: Entwuerfe des Users auflisten (Inhalt des "entwuerfe"-Systemordners)
      responses:
        "200":
          description: Liste der Entwuerfe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Draft"
    post:
      summary: >
        Neuen (leeren oder vorbefuellten) Entwurf anlegen -- beim Start
        eines Compose-Vorgangs (neue Mail oder Antwort). Siehe WEB_INBOX.md
        09.09. "KORREKTUR/ERWEITERUNG des Ordner-Umbau-Eintrags".
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                inReplyToMessageId: { type: string, format: uuid, nullable: true }
                to:
                  type: array
                  items: { type: string }
                cc:
                  type: array
                  items: { type: string }
                bcc:
                  type: array
                  items: { type: string }
                  description: >
                    [2026-09-21] "NEUE AUFTRAEGE - 5 Wettbewerbs-Luecken"
                    Punkt 4 ("Schedule Send") -- analog zu bcc bei
                    POST /messages/send.
                subject: { type: string }
                bodyText: { type: string }
                scheduledFor:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    [2026-09-21] "NEUE AUFTRAEGE - 5 Wettbewerbs-Luecken"
                    Punkt 4 ("Schedule Send"): gesetzt = dieser Entwurf wird
                    automatisch verschickt, sobald der Zeitpunkt erreicht
                    ist (muss in der Zukunft liegen, sonst 400). NULL/nicht
                    gesetzt = normaler Entwurf ohne automatischen Versand.
      responses:
        "200":
          description: Angelegter Entwurf
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"

  /drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Laufendes Speichern waehrend des Tippens oder beim Verlassen des Compose-Screens
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: array
                  items: { type: string }
                cc:
                  type: array
                  items: { type: string }
                bcc:
                  type: array
                  items: { type: string }
                subject: { type: string }
                bodyText: { type: string }
                scheduledFor:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "200":
          description: Aktualisierter Entwurf
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          description: Entwurf nicht gefunden
    delete:
      summary: Entwurf verwerfen (Auto-Loeschung nach erfolgreichem Senden, siehe POST /messages/send draftId)
      responses:
        "200":
          description: Geloescht
        "404":
          description: Entwurf nicht gefunden

  /signatures:
    get:
      summary: >
        Signaturen des Users auflisten, optional gefiltert per accountId
        (analog zu GET /folders/GET /messages -- "getrennte Ansichten pro
        Konto"). [2026-09-21] "Abwesenheitsassistent"-Auftrag: dieser
        Endpunkt war seit dem allerersten Durchstich im Contract definiert,
        aber nie vom Backend implementiert (siehe backend/README.md) --
        jetzt echt.
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Liste der Signaturen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signature"
    post:
      summary: Neue Signatur anlegen
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signature"
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signature"

  /signatures/{signatureId}:
    patch:
      summary: Signatur bearbeiten
      parameters:
        - name: signatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signature"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signature"
    delete:
      summary: Signatur löschen
      parameters:
        - name: signatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Gelöscht

  /absence-responder:
    get:
      summary: >
        [2026-09-21] WEB_INBOX.md "NEUER AUFTRAG - Abwesenheitsassistent":
        aktuelle Abwesenheitsassistent-Einstellung des Users abrufen.
        Kontoweit (nicht pro Mail-Konto), genau eine Konfiguration pro User.
      responses:
        "200":
          description: Aktuelle Einstellung (active=false, wenn nie konfiguriert)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceResponder"
    put:
      summary: >
        Einstellung setzen. active=true verlangt startDate + subject + body
        (entweder in diesem Request mitgeschickt oder bereits vorher
        gespeichert) -- sonst 400. Die bestehende Standard-Signatur des
        Kontos (siehe /signatures) wird automatisch angehaengt, wenn beim
        tatsaechlichen automatischen Versand eine existiert (kein
        eigenes Signatur-Feld hier). Sicherheits-Ausnahme (kein Contract-
        Feld, serverseitig fest verdrahtet, siehe backend/README.md): KEINE
        automatische Antwort an Absender mit classification=spam/phishing,
        spamSubcategory=advance_fee_scam, oder mit List-Unsubscribe-Header
        (vermutlich Mailingliste). Pro Absender maximal eine Antwort alle
        4 Tage (konfigurierbar per ABSENCE_RESPONDER_COOLDOWN_DAYS).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbsenceResponder"
      responses:
        "200":
          description: Gespeicherte Einstellung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceResponder"
        "400":
          description: active=true ohne startDate/subject/body

  /reminders:
    get:
      summary: >
        Anstehende Erinnerungen auflisten (werden automatisch bei
        POST /contracts/{contractId}/confirm angelegt, kein eigener
        POST-Endpoint noetig).
      responses:
        "200":
          description: Liste der Erinnerungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"

  /reminders/{reminderId}:
    patch:
      summary: Erinnerung verschieben (snooze) oder als gesendet markieren
      parameters:
        - name: reminderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                snoozedUntil: { type: string, format: date-time, nullable: true }
                sent: { type: boolean }
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"

  /contracts:
    get:
      summary: Erkannte Verträge auflisten
      responses:
        "200":
          description: Liste der Verträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"

  /contracts/{contractId}/confirm:
    post:
      summary: Erkannte Vertragsdaten bestätigen oder korrigieren
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contract"
      responses:
        "200":
          description: Bestätigt

  /capability-check:
    post:
      summary: Ergebnis des On-Device-KI-Checks an Backend melden
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAiCapability"
      responses:
        "200":
          description: Gespeichert

  /ai-settings:
    get:
      summary: >
        [2026-09-21] KORREKTUR (TERMINAL_INBOX.md 21.09., ersetzt
        WEB_INBOX.md "ECHTE KI-ANBINDUNG" c3ec563): eigene Cloud-KI-
        Zugangsdaten des Users (BYOK) abfragen. apiKey wird NIE
        zurückgegeben, nur ob einer hinterlegt ist (hasApiKey).
      responses:
        "200":
          description: Aktuelle Einstellung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
    put:
      summary: >
        Cloud-KI-Einstellung setzen. mode=off löscht byokProvider/apiKey
        serverseitig. mode=byok verlangt byokProvider + apiKey (Ausnahme:
        apiKey darf weggelassen werden, wenn schon einer hinterlegt ist und
        nur cloudConsent geändert wird) -- byokProvider aktuell nur
        'anthropic'/'openai' wirklich angebunden, 'google'/'other' liefern
        400 (ehrlich als "noch nicht implementiert" markiert, kein stiller
        Fehlschlag beim tatsächlichen Versand). cloudConsent ist unabhängig
        vom Rest jederzeit setz-/widerrufbar. Echter Cloud-Dispatch (siehe
        GET /messages/{id}/summary, POST /messages/{id}/reply-draft)
        braucht IMMER mode=byok UND einen hinterlegten Key UND
        cloudConsent=true gleichzeitig, serverseitig bei jedem einzelnen
        Dispatch geprüft (nicht nur einmalig beim Speichern).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [off, byok] }
                byokProvider: { type: string, enum: [anthropic, openai, google, other], nullable: true }
                apiKey:
                  type: string
                  nullable: true
                  description: Nur beim Setzen/Ändern gesendet, wird verschlüsselt gespeichert.
                cloudConsent: { type: boolean, nullable: true }
      responses:
        "200":
          description: Gespeicherte Einstellung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "400":
          description: Ungültige Kombination (z.B. mode=byok ohne Provider/Key, oder nicht angebundener Provider)

  /settings:
    get:
      summary: >
        [2026-09-21] WEB_INBOX.md "NEUER AUFTRAG - Einstellungsbereich +
        Info-Seite", Punkt 1 "Ansicht": allgemeine UI-Präferenzen des Users
        (aktuell nur accentTheme, bewusst als eigener, erweiterbarer
        Endpunkt statt in ein bestehendes Objekt gequetscht -- BYOK hat
        schon seinen eigenen /ai-settings-Endpunkt aus demselben Grund).
      responses:
        "200":
          description: Aktuelle Einstellungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    put:
      summary: Einstellung setzen.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accentTheme: { type: string, enum: [teal, ocean_blue, violett, koralle, ocean_verlauf] }
                strictUnknownSenders: { type: boolean }
                nudgeUnansweredEnabled:
                  type: boolean
                  description: >
                    [2026-09-21] Nachtrag -- war in UserSettings bereits
                    dokumentiert, hier im PUT-Request-Body noch vergessen.
      responses:
        "200":
          description: Gespeicherte Einstellungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          description: Ungültiger accentTheme-Wert

  /privacy-settings:
    get:
      summary: >
        [2026-09-21] "NEUE AUFTRAEGE - 5 Wettbewerbs-Luecken" Punkt 1
        ("Tracking-Pixel-Blockierung"). Siehe `PrivacySettings.
        blockRemoteImages`: hat seit "NEUE GRUNDLAGE - HTML-Rendering des
        Mail-Bodies" eine echte technische Wirkung (siehe
        backend/README.md "HTML-Rendering des Mail-Bodies").
      responses:
        "200":
          description: Aktuelle Privatsphäre-Einstellungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"
    put:
      summary: Einstellung setzen.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blockRemoteImages: { type: boolean }
                blockTrackingLinks: { type: boolean }
      responses:
        "200":
          description: Gespeicherte Einstellungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"

  /security/breaches:
    get:
      summary: >
        [2026-09-21] "NEUE AUFTRAEGE - 5 Wettbewerbs-Luecken" Punkt 3
        ("Darkweb-/Datenleck-Ueberwachung"): bekannte Datenleck-Treffer
        fuer alle verbundenen Konten des Users. Mock-Anbindung, siehe
        backend/README.md.
      responses:
        "200":
          description: Liste der Datenleck-Treffer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataBreachFinding"

  /security/breaches/{breachId}:
    parameters:
      - name: breachId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Datenleck-Treffer als gesehen/bestaetigt markieren (blendet den Warnhinweis aus)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [acknowledged]
              properties:
                acknowledged: { type: boolean }
      responses:
        "200":
          description: Aktualisierter Treffer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataBreachFinding"
        "404":
          description: Treffer nicht gefunden

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Session-Token nach OAuth-Verknuepfung des Mail-Kontos. userId wird
        serverseitig aus dem Token aufgeloest, nie aus Request-Body/Query/Pfad
        vertraut.

  schemas:
    Folder:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId:
          type: string
          format: uuid
          description: >
            [2026-09-21] Mehrfach-Konten (WEB_INBOX.md 21.09. Punkt 2):
            Ordner gehoeren jetzt zu GENAU EINEM Mail-Konto ("getrennte
            Ansichten pro Konto", nicht ein vereinheitlichter Eingang) --
            jedes verbundene Konto hat seine eigenen 7 System-Ordner.
        name: { type: string }
        icon: { type: string }
        isSystem: { type: boolean }
        systemKey:
          type: string
          nullable: true
          enum: [eingang, entwuerfe, gesendet, sonstiges, quarantaene, spam, papierkorb]
        sortOrder: { type: integer }

    MailProvider:
      type: object
      description: >
        Ein Eintrag aus contracts/mail-providers.json (GET /mail-providers).
        Fuer authType=imap/pop3 sind imapHost/imapPort/imapSecure/smtpHost/
        smtpPort/smtpSecure Presets zum Vorbefuellen des Verbindungs-
        Formulars (bei authType=pop3 tragen dieselben Felder die POP3-
        Servereinstellungen, siehe mail-providers.json "web_de") --
        `other_imap` hat bewusst null-Host-Felder (User muss selbst
        eintragen). [2026-09-22] authType=pop3 neu (Massimo: "web.de ist
        POP3" -- soll automatisch erkannt werden, ohne dass der User danach
        gefragt wird, siehe ios/README.md). [2026-09-25] `domains` neu
        (WEB_INBOX.md 21.09. "Anbieter automatisch aus E-Mail-Adresse
        erkennen"): Kleinbuchstaben-Domains ohne "@", die dieser Provider
        abdeckt -- Client matcht die eingegebene E-Mail-Adresse dagegen,
        statt den User vor der Adresseingabe nach dem Anbieter zu fragen.
        `other_imap` hat bewusst eine leere Liste (Fallback fuer jede nicht
        erkannte Domain).
      properties:
        id: { type: string }
        label: { type: string }
        authType: { type: string, enum: [oauth, imap, pop3] }
        comingSoon: { type: boolean }
        imapHost: { type: string, nullable: true }
        imapPort: { type: integer, nullable: true }
        imapSecure: { type: boolean, nullable: true }
        smtpHost: { type: string, nullable: true }
        smtpPort: { type: integer, nullable: true }
        smtpSecure: { type: boolean, nullable: true }
        requiresAppPassword: { type: boolean }
        appPasswordHelpUrl: { type: string, nullable: true }
        domains: { type: array, items: { type: string } }

    TrustedSender:
      type: object
      properties:
        id: { type: string, format: uuid }
        senderAddress: { type: string }
        addedAt: { type: string, format: date-time }

    Draft:
      type: object
      properties:
        id: { type: string, format: uuid }
        inReplyToMessageId: { type: string, format: uuid, nullable: true }
        to:
          type: array
          items: { type: string }
        cc:
          type: array
          items: { type: string }
        bcc:
          type: array
          items: { type: string }
        subject: { type: string, nullable: true }
        bodyText: { type: string, nullable: true }
        scheduledFor: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }

    MailAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [gmail, imap] }
        emailAddress: { type: string }
        syncStatus: { type: string, enum: [pending, syncing, ok, error] }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        fromAddress: { type: string }
        fromDisplayName: { type: string }
        subject: { type: string }
        receivedAt: { type: string, format: date-time }
        folderId: { type: string, format: uuid }
        classification:
          type: string
          enum: [safe, spam, phishing, unclear]
        inReplyToMessageId:
          type: string
          format: uuid
          nullable: true
          description: >
            [2026-09-21] WEB_INBOX.md "FUENF NEUE KOMFORT-FEATURES", Punkt 4
            "Threaded Ansicht" -- vorher nur auf MessageDetail. Grundlage fuer
            client-seitiges Gruppieren von Nachrichten in der Listenansicht
            (Eltern-Verweis nur innerhalb desselben Kontos aufloesbar, siehe
            backend/README.md).
        awaitingReply:
          type: boolean
          description: >
            [2026-09-21] WEB_INBOX.md "DREI WEITERE FEATURES - Gmail-
            Recherche" Punkt 2 ("Nudge"): true, wenn diese Nachricht seit
            mindestens dem Schwellenwert (Default 3 Tage) unbeantwortet ist
            (Eingang: keine eigene Antwort im selben Thread; Gesendet: keine
            Antwort erhalten) UND der User die Erinnerung nicht in den
            Einstellungen deaktiviert hat UND die Nachricht nicht als spam/
            phishing klassifiziert ist. Zur Laufzeit abgeleitet, kein eigenes
            Feld/Cache -- siehe backend/src/mail/nudge.ts.
        confidentialUntil:
          type: string
          format: date-time
          nullable: true
          description: >
            [2026-09-21] WEB_INBOX.md "DREI WEITERE FEATURES - Gmail-
            Recherche" Punkt 3 ("Vertraulicher Modus"): nur bei selbst
            gesendeten Nachrichten setzbar (siehe POST /messages/send). Nach
            Ablauf wird bodyText serverseitig geloescht (siehe MessageDetail
            unten) -- dieses Feld selbst bleibt erhalten, damit der Client
            "war vertraulich, seit X abgelaufen" anzeigen kann.
        snoozedUntil:
          type: string
          format: date-time
          nullable: true
          description: >
            [2026-09-21] "NEUE AUFTRAEGE - 5 Wettbewerbs-Luecken" Punkt 5
            ("Snooze"), siehe POST /messages/{messageId}/snooze. Solange
            dieser Zeitpunkt in der Zukunft liegt, taucht die Nachricht in
            GET /messages nicht auf (siehe dortige Beschreibung) -- dieses
            Feld ist deshalb nur ueber GET /messages/{messageId} direkt
            sichtbar, z.B. fuer eine spaetere "Snoozed"-Uebersicht.

    MessageDetail:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          properties:
            bodyText:
              type: string
              nullable: true
              description: >
                Kann `null` sein, wenn `confidentialUntil` in der
                Vergangenheit liegt (Vertraulicher Modus, siehe oben) -- der
                Text wurde dann serverseitig geloescht.
            bodyHtml:
              type: string
              nullable: true
              description: >
                [2026-09-21] "NEUE GRUNDLAGE - HTML-Rendering des
                Mail-Bodies": bereits SANITISIERT (Script/Iframe/Form/Object
                etc. entfernt, siehe backend/README.md "HTML-Rendering des
                Mail-Bodies"). `null` bei reinen Text-Mails, ODER wenn der
                Vertrauliche-Modus-Ablauf den Inhalt bereits geloescht hat
                (gleiche Bedingung wie bei `bodyText` oben). Jeder
                http(s)-Link im HTML ist auf `GET /link-check` umgeschrieben
                (siehe dort). Enthaelt kein `<img src>` fuer Remote-Bilder,
                wenn der User `blockRemoteImages` aktiviert hat (Default,
                siehe `PrivacySettings`).
            security:
              $ref: "#/components/schemas/SecurityResult"
            links:
              type: array
              items:
                $ref: "#/components/schemas/MessageLink"
              description: >
                [2026-09-21] "NEUE GRUNDLAGE - HTML-Rendering des
                Mail-Bodies": echte <a href>-Links, extrahiert aus dem
                HTML-Koerper beim Sync (message_links-Tabelle) -- vorher seit
                Track 0 im Contract dokumentiert, aber nie befuellt worden.
                Leeres Array bei reinen Text-Mails (keine Links extrahierbar)
                oder wenn der HTML-Koerper keine `<a href>`-Tags enthaelt.
            quarantine:
              $ref: "#/components/schemas/QuarantineInfo"
            canUnsubscribe:
              type: boolean
              description: >
                true, wenn die Nachricht einen syntaktisch gueltigen
                List-Unsubscribe-Header hat (unabhaengig von classification)
                -- steuert, ob die Client-UI den manuellen Abmelden-Button
                zu POST /messages/{messageId}/unsubscribe anbietet.
            isNewSender:
              type: boolean
              description: >
                "Erster Kontakt"-Kennzeichnung (WEB_INBOX.md 15.09.): true,
                wenn es fuer dieses Konto keine andere Nachricht von
                derselben fromAddress gibt. Zur Laufzeit abgeleitet, kein
                Ruecktausch bei spaeter eintreffender aelterer Mail. Ergaenzt
                sich mit GET /trusted-senders -- die Client-UI kombiniert
                beides (Badge nur bei isNewSender=true UND Absender nicht
                auf der Whitelist).
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/MessageAttachment"
              description: >
                [2026-09-21] "WICHTIGE LUECKE ENTDECKT - echter Malware-Scan":
                Anhaenge dieser Nachricht wurden beim Mail-Sync bereits
                gescannt (ClamAV + Magic-Bytes-Pruefung, siehe
                backend/README.md "Malware-Scan"), BEVOR sie hier sichtbar
                werden. Ein als 'malicious'/'scan_failed' erkannter Anhang
                wird NICHT automatisch geloescht (die Mail selbst bleibt
                immer sichtbar) -- nur der Anhang selbst ist gesperrt, die
                Client-UI muss `scanStatus` respektieren und darf einen
                nicht-'clean' Anhang nicht zum Oeffnen/Herunterladen anbieten.

    MessageAttachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mimeType: { type: string, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        scanStatus:
          type: string
          enum: [pending, clean, malicious, blocked_type, scan_failed]
        isDangerousType: { type: boolean }
        containsSensitiveDocument:
          type: string
          enum: [none, credit_card, id_document]

    QuarantineInfo:
      type: object
      nullable: true
      description: >
        Nur gesetzt, wenn sich die Nachricht aktuell im Quarantaene-Ordner
        befindet (quarantine-Tabelle in db-schema.sql), sonst null.
        TERMINAL_INBOX.md 08.09. Punkt 6: bisher gab es keinen GET-Weg fuer
        reason/auto_delete_at, obwohl die Spalten seit Track 0 existieren.
      properties:
        reason: { type: string }
        autoDeleteAt: { type: string, format: date-time }
        userReviewed: { type: boolean }

    MessageLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayText: { type: string, nullable: true }
        actualUrl: { type: string }
        domainMatchesDisplay:
          type: boolean
          description: >
            false = klassischer Phishing-Indikator (Anzeigetext behauptet
            eine Domain, das tatsaechliche href-Ziel zeigt auf eine andere).
            Nur ausgewertet, wenn der Anzeigetext selbst wie eine
            Domain/URL aussieht -- sonst immer `true` (kein Fehlalarm, aber
            auch kein Signal), siehe security-classification/isLinkMismatch.
        isKnownMalicious:
          type: boolean
          description: >
            Immer `false` -- kein externer Blocklist-Abgleich angebunden
            (gleiches, bereits an mehreren Stellen dokumentiertes
            Grenzen-Muster wie `ipReputationFlag`/`domainReputationScore`).

    SecurityResult:
      type: object
      properties:
        spfStatus: { type: string, enum: [pass, fail, none] }
        dkimStatus: { type: string, enum: [pass, fail, none] }
        dmarcStatus: { type: string, enum: [pass, fail, none] }
        senderDomainAgeDays: { type: integer, nullable: true }
        domainReputationScore: { type: number, format: float, nullable: true }
        homoglyphDetected: { type: boolean }
        linkMismatchDetected: { type: boolean }
        displayNameSpoofingDetected: { type: boolean }
        replyToMismatchDetected: { type: boolean }
        urgencyLanguageScore: { type: number, format: float, nullable: true }
        containsNewIban: { type: boolean }
        ibanChangedInThread:
          type: boolean
          description: >
            true, wenn eine fruehere Nachricht desselben Threads eine andere
            IBAN enthielt als diese Nachricht (WEB_INBOX.md 15.09.,
            "IBAN-Wechsel im selben Thread").
        classification: { type: string, enum: [safe, spam, phishing, unclear] }
        spamSubcategory:
          type: string
          nullable: true
          enum: [adult, gambling, generic, marketing, advance_fee_scam]
        ipReputationFlag:
          type: string
          nullable: true
          enum: [clean, known_botnet, unknown]
        heloMismatch: { type: boolean }
        imageToTextRatio: { type: number, format: float, nullable: true }
        confidenceScore: { type: number, format: float }

    MailSummary:
      type: object
      properties:
        summaryText: { type: string }
        actionRequired: { type: boolean }
        actionDescription: { type: string }
        deadline: { type: string, format: date, nullable: true }
        source:
          type: string
          enum: [on_device, cloud_fallback, heuristic]
          description: >
            [2026-09-21] KORREKTUR (TERMINAL_INBOX.md 21.09.): neuer Wert
            "heuristic" -- deterministische Mustererkennung ohne KI-Modell,
            weder On-Device-Modell noch externer Cloud-Anbieter beteiligt.
            Vorher fälschlich immer als "cloud_fallback" geliefert.

    AiSettings:
      type: object
      description: >
        [2026-09-21] KORREKTUR (TERMINAL_INBOX.md 21.09.), siehe GET/PUT
        /ai-settings. Spiegelt db-schema.sql user_ai_preference, ohne den
        Key selbst.
      properties:
        mode: { type: string, enum: [off, byok] }
        byokProvider: { type: string, enum: [anthropic, openai, google, other], nullable: true }
        hasApiKey: { type: boolean }
        cloudConsentGiven: { type: boolean }

    PrivacySettings:
      type: object
      description: >
        [2026-09-21] "NEUE AUFTRAEGE - 5 Wettbewerbs-Luecken" Punkt 1,
        siehe GET/PUT /privacy-settings.
      properties:
        blockRemoteImages:
          type: boolean
          description: >
            [2026-09-21 UPDATE, "NEUE GRUNDLAGE - HTML-Rendering des
            Mail-Bodies"] hat jetzt eine ECHTE Wirkung: bei `true` entfernt
            der Server jedes `<img src="http(s)://...">` aus MessageDetail.
            bodyHtml (u.a. der klassische Tracking-Pixel), bevor die Mail
            den Client erreicht. Default true.
        blockTrackingLinks:
          type: boolean
          description: >
            [2026-09-21] Weiterhin ohne eigene technische Wirkung -- zu
            unterscheiden von der davon UNABHAENGIGEN Klick-Zeit-Link-
            Pruefung (GET /link-check), die JEDEN http(s)-Link umschreibt,
            unabhaengig von diesem Schalter. Eine echte Umsetzung braeuchte
            eine eigene Erkennung "ist dieser Link ein Marketing-/Analytics-
            Tracking-Redirect" -- message_links (jetzt befuellt, siehe
            `MessageLink`) liefert dafuer noch kein passendes Signal
            (domainMatchesDisplay/isKnownMalicious sind Phishing-, keine
            Tracking-Signale). Separater, noch offener Schritt. Schalter
            existiert bereits, damit die UI/Einstellungen nicht nochmal
            angefasst werden muessen, sobald das nachgezogen wird. Default
            true.

    DataBreachFinding:
      type: object
      description: >
        [2026-09-21] "NEUE AUFTRAEGE - 5 Wettbewerbs-Luecken" Punkt 3,
        siehe GET /security/breaches.
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        breachName: { type: string }
        breachDate: { type: string, format: date, nullable: true }
        discoveredAt: { type: string, format: date-time }
        acknowledged: { type: boolean }

    UserSettings:
      type: object
      description: >
        [2026-09-21] WEB_INBOX.md "NEUER AUFTRAG - Einstellungsbereich",
        siehe GET/PUT /settings.
      properties:
        accentTheme:
          type: string
          enum: [teal, ocean_blue, violett, koralle, ocean_verlauf]
          description: >
            Nur die neutrale Akzentfarbe (Buttons, Links, ausgewählte
            Zeile, aktiver Ordner) -- siehe design-tokens.json
            color.accentThemes. danger/warning/success bleiben fest für
            alle User.
        strictUnknownSenders:
          type: boolean
          description: >
            [2026-09-21] WEB_INBOX.md "FUENF NEUE KOMFORT-FEATURES" Punkt 1:
            wenn true (Default), zeigen Web/iOS Mails von Absendern ohne
            Whitelist-Eintrag (isNewSender=true, siehe MessageDetail)
            staerker hervorgehoben an als das bestehende dezente "Neuer
            Absender"-Badge -- reine Client-Darstellungsentscheidung, das
            Backend liefert isNewSender unveraendert, nur dieser Schalter
            neu.
        nudgeUnansweredEnabled:
          type: boolean
          description: >
            [2026-09-21] WEB_INBOX.md "DREI WEITERE FEATURES - Gmail-
            Recherche" Punkt 2 ("Nudge"): Ein/Aus-Schalter fuer
            Message.awaitingReply, Default true (wie Gmail).

    Contract:
      type: object
      properties:
        id: { type: string, format: uuid }
        providerName: { type: string }
        contractStart: { type: string, format: date, nullable: true }
        contractEnd: { type: string, format: date, nullable: true }
        cancellationDeadline: { type: string, format: date, nullable: true }
        cancellationPeriodDays: { type: integer, nullable: true }
        status: { type: string, enum: [active, cancelled, expired, needs_review] }
        extractedConfidence: { type: number, format: float }

    Signature:
      type: object
      properties:
        id: { type: string, format: uuid }
        mailAccountId: { type: string, format: uuid }
        contentHtml: { type: string }
        isDefault: { type: boolean }
        applyToNew: { type: boolean }
        applyToReplies: { type: boolean }

    AbsenceResponder:
      type: object
      description: >
        [2026-09-21] WEB_INBOX.md "NEUER AUFTRAG - Abwesenheitsassistent",
        siehe GET/PUT /absence-responder.
      properties:
        active: { type: boolean }
        startDate: { type: string, format: date, nullable: true }
        endDate:
          type: string
          format: date
          nullable: true
          description: "null = unbefristet, kein automatisches Abschalten."
        subject: { type: string, nullable: true }
        body: { type: string, nullable: true }

    Reminder:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        remindAt: { type: string, format: date-time }
        sent: { type: boolean }
        snoozedUntil: { type: string, format: date-time, nullable: true }

    UserAiCapability:
      type: object
      properties:
        platform: { type: string, enum: [ios, android, windows, web] }
        deviceModel: { type: string }
        osVersion: { type: string }
        onDeviceSupported: { type: boolean }
        activeMode: { type: string, enum: [on_device, cloud_fallback] }
