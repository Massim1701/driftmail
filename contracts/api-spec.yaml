openapi: 3.0.3
info:
  title: driftmail API
  version: 0.1.0
  description: >
    Track 0 Contract. Track A implementiert diese Spec real.
    Track C und F bauen zunächst gegen einen Mock-Server, der exakt
    diese Response-Formate zurückgibt.

servers:
  - url: https://api.driftware.online/v1

security:
  - bearerAuth: []

paths:
  /auth/session:
    post:
      summary: >
        Session-Token erneuern/erstellen. Login selbst passiert implizit
        durch den OAuth-Flow beim Verbinden eines Mail-Kontos, dieser
        Endpoint dient nur der Token-Erneuerung.
      security: []
      responses:
        "200":
          description: Neues Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }

  /accounts:
    get:
      summary: Verbundene Mail-Konten des Users auflisten
      responses:
        "200":
          description: Liste der Mail-Konten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MailAccount"

  /folders:
    get:
      summary: Ordner des Users auflisten (System- und eigene Ordner)
      responses:
        "200":
          description: Liste der Ordner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
    post:
      summary: Neuen eigenen Ordner anlegen
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                icon: { type: string }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"

  /folders/{folderId}:
    patch:
      summary: Ordner umbenennen/Icon ändern (System-Ordner außer quarantaene/spam ebenfalls umbenennbar)
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                icon: { type: string }
                sortOrder: { type: integer }
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
    delete:
      summary: Eigenen Ordner löschen (System-Ordner nicht löschbar)
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Gelöscht

  /messages:
    get:
      summary: Nachrichten eines Ordners abrufen
      parameters:
        - name: folderId
          in: query
          schema:
            type: string
            format: uuid
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Liste der Nachrichten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /messages/{messageId}:
    get:
      summary: Einzelne Nachricht inkl. Security-Analyse und Links
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nachricht mit Analyse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetail"
    delete:
      summary: Mail in den Papierkorb verschieben (soft delete)
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: In Papierkorb verschoben

  /messages/{messageId}/permanent:
    delete:
      summary: Mail endgueltig loeschen (nur aus dem Papierkorb heraus moeglich)
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Endgueltig geloescht

  /messages/{messageId}/quarantine:
    post:
      summary: Nachricht manuell in Quarantäne verschieben
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Quarantäne-Eintrag erstellt

  /messages/{messageId}/move:
    post:
      summary: Nachricht in einen anderen Ordner verschieben
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [folderId]
              properties:
                folderId: { type: string, format: uuid }
      responses:
        "200":
          description: Verschoben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/{messageId}/unsubscribe:
    post:
      summary: >
        Abmeldung ueber RFC-8058 List-Unsubscribe-Header anstoßen. Legt einen
        unsubscribe_actions-Eintrag mit status='pending_confirmation' an,
        nie automatischer Klick auf Links im Mail-Body.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Abmeldung angestoßen
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending_confirmation, confirmed, rejected]

  /messages/{messageId}/summary:
    get:
      summary: KI-Zusammenfassung ("Was wollen die von mir")
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Zusammenfassung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSummary"

  /messages/{messageId}/reply-draft:
    post:
      summary: Antwortentwurf generieren lassen
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entwurf
          content:
            application/json:
              schema:
                type: object
                properties:
                  draftText:
                    type: string

  /messages/draft/phishing-check:
    post:
      summary: >
        Prueft einen Mail-Entwurf vor dem Versand auf Phishing-Merkmale
        (harter Block, siehe blocked) sowie nicht-blockierende Warnsignale
        (sensible Daten, Empfaenger-Reputation, riskante Links). Nutzt
        dieselben Signale wie SecurityResult/analyzeMail, angewendet auf den
        eigenen Entwurf statt auf eingehende Mails (siehe WEB_INBOX.md 08.09.).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bodyText: { type: string }
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      displayText: { type: string }
                      actualUrl: { type: string }
      responses:
        "200":
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: boolean
                    description: >
                      true = Phishing-Merkmale erkannt, Versand MUSS verhindert
                      werden (kein Warnen-und-trotzdem-erlauben).
                  reason: { type: string, nullable: true }
                  containsSensitiveData:
                    type: array
                    items: { type: string, enum: [iban, credit_card, other] }
                  recipientReputation:
                    type: string
                    enum: [safe, unknown, flagged]
                  riskyLinks:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        reason: { type: string }

  /signatures:
    get:
      summary: Signaturen des Users auflisten
      responses:
        "200":
          description: Liste der Signaturen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signature"
    post:
      summary: Neue Signatur anlegen
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signature"
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signature"

  /signatures/{signatureId}:
    patch:
      summary: Signatur bearbeiten
      parameters:
        - name: signatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signature"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signature"
    delete:
      summary: Signatur löschen
      parameters:
        - name: signatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Gelöscht

  /reminders:
    get:
      summary: >
        Anstehende Erinnerungen auflisten (werden automatisch bei
        POST /contracts/{contractId}/confirm angelegt, kein eigener
        POST-Endpoint noetig).
      responses:
        "200":
          description: Liste der Erinnerungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"

  /reminders/{reminderId}:
    patch:
      summary: Erinnerung verschieben (snooze) oder als gesendet markieren
      parameters:
        - name: reminderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                snoozedUntil: { type: string, format: date-time, nullable: true }
                sent: { type: boolean }
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"

  /contracts:
    get:
      summary: Erkannte Verträge auflisten
      responses:
        "200":
          description: Liste der Verträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"

  /contracts/{contractId}/confirm:
    post:
      summary: Erkannte Vertragsdaten bestätigen oder korrigieren
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contract"
      responses:
        "200":
          description: Bestätigt

  /capability-check:
    post:
      summary: Ergebnis des On-Device-KI-Checks an Backend melden
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAiCapability"
      responses:
        "200":
          description: Gespeichert

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Session-Token nach OAuth-Verknuepfung des Mail-Kontos. userId wird
        serverseitig aus dem Token aufgeloest, nie aus Request-Body/Query/Pfad
        vertraut.

  schemas:
    Folder:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
        isSystem: { type: boolean }
        systemKey:
          type: string
          nullable: true
          enum: [wichtig, sonstiges, rechnungen, quarantaene, spam, papierkorb]
        sortOrder: { type: integer }

    MailAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [gmail, imap] }
        emailAddress: { type: string }
        syncStatus: { type: string, enum: [pending, syncing, ok, error] }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        fromAddress: { type: string }
        fromDisplayName: { type: string }
        subject: { type: string }
        receivedAt: { type: string, format: date-time }
        folderId: { type: string, format: uuid }
        classification:
          type: string
          enum: [safe, spam, phishing, unclear]

    MessageDetail:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          properties:
            bodyText: { type: string }
            security:
              $ref: "#/components/schemas/SecurityResult"
            links:
              type: array
              items:
                $ref: "#/components/schemas/MessageLink"

    MessageLink:
      type: object
      properties:
        displayText: { type: string }
        actualUrl: { type: string }
        domainMatchesDisplay: { type: boolean }
        isKnownMalicious: { type: boolean }

    SecurityResult:
      type: object
      properties:
        spfStatus: { type: string, enum: [pass, fail, none] }
        dkimStatus: { type: string, enum: [pass, fail, none] }
        dmarcStatus: { type: string, enum: [pass, fail, none] }
        senderDomainAgeDays: { type: integer, nullable: true }
        domainReputationScore: { type: number, format: float, nullable: true }
        homoglyphDetected: { type: boolean }
        linkMismatchDetected: { type: boolean }
        urgencyLanguageScore: { type: number, format: float, nullable: true }
        containsNewIban: { type: boolean }
        classification: { type: string, enum: [safe, spam, phishing, unclear] }
        spamSubcategory:
          type: string
          nullable: true
          enum: [adult, gambling, generic, marketing]
        ipReputationFlag:
          type: string
          nullable: true
          enum: [clean, known_botnet, unknown]
        heloMismatch: { type: boolean }
        imageToTextRatio: { type: number, format: float, nullable: true }
        confidenceScore: { type: number, format: float }

    MailSummary:
      type: object
      properties:
        summaryText: { type: string }
        actionRequired: { type: boolean }
        actionDescription: { type: string }
        deadline: { type: string, format: date, nullable: true }
        source: { type: string, enum: [on_device, cloud_fallback] }

    Contract:
      type: object
      properties:
        id: { type: string, format: uuid }
        providerName: { type: string }
        contractStart: { type: string, format: date, nullable: true }
        contractEnd: { type: string, format: date, nullable: true }
        cancellationDeadline: { type: string, format: date, nullable: true }
        cancellationPeriodDays: { type: integer, nullable: true }
        status: { type: string, enum: [active, cancelled, expired, needs_review] }
        extractedConfidence: { type: number, format: float }

    Signature:
      type: object
      properties:
        id: { type: string, format: uuid }
        mailAccountId: { type: string, format: uuid }
        contentHtml: { type: string }
        isDefault: { type: boolean }
        applyToNew: { type: boolean }
        applyToReplies: { type: boolean }

    Reminder:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        remindAt: { type: string, format: date-time }
        sent: { type: boolean }
        snoozedUntil: { type: string, format: date-time, nullable: true }

    UserAiCapability:
      type: object
      properties:
        platform: { type: string, enum: [ios, android, windows, web] }
        deviceModel: { type: string }
        osVersion: { type: string }
        onDeviceSupported: { type: boolean }
        activeMode: { type: string, enum: [on_device, cloud_fallback] }
